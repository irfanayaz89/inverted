<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mirror Trace</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="game"><canvas id="c" width="400" height="700"></canvas></div>
<script src="engine.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const inv = Inverted.create({
  root: document.getElementById('game'), width: 400, height: 700,
  title: 'Mirror Trace',
  subtitle: 'Trace the shape. Your hand will betray you.',
  howTo: [
    'Put your finger down and trace the grey shape in one stroke, starting at the pink dot.',
    'Your line does NOT appear under your finger. Each level reflects it a new way.',
    'Lift your finger to score. Cover the shape, stay on the line.',
    'Upside down, always. Sideways mirrors it again. Yes, it stacks.',
  ],
});

const CX = 200, CY = 390;
function poly(pts, closed) { const p = pts.map(([x, y]) => ({ x: CX + x, y: CY + y })); if (closed) p.push(p[0]); return p; }
function curve(f, n = 120) { const p = []; for (let i = 0; i <= n; i++) { const [x, y] = f(i / n); p.push({ x: CX + x, y: CY + y }); } return p; }
const SHAPES = [
  { name: 'Zig', path: poly([[-140, -40], [-70, 60], [0, -40], [70, 60], [140, -40]]) },
  { name: 'Triangle', path: poly([[0, -150], [140, 110], [-140, 110]], true) },
  { name: 'House', path: poly([[-110, 140], [-110, -20], [0, -140], [110, -20], [110, 140]]) },
  { name: 'Star', path: (() => { const p = []; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 4 * Math.PI / 5; p.push([150 * Math.cos(a), 150 * Math.sin(a)]); } return poly(p, true); })() },
  { name: 'Spiral', path: curve(t => { const a = t * Math.PI * 5, r = 20 + 130 * t; return [r * Math.cos(a), r * Math.sin(a)]; }, 200) },
  { name: 'Heart', path: curve(t => { const a = t * Math.PI * 2; return [9 * 16 * Math.pow(Math.sin(a), 3), -9 * (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) - 10]; }) },
];
const MAPS = [
  { name: 'mirror left/right', f: p => ({ x: 2 * CX - p.x, y: p.y }) },
  { name: 'mirror top/bottom', f: p => ({ x: p.x, y: 2 * CY - p.y }) },
  { name: 'both at once', f: p => ({ x: 2 * CX - p.x, y: 2 * CY - p.y }) },
  { name: 'turned 90°', f: p => ({ x: CX - (p.y - CY), y: CY + (p.x - CX) }) },
  { name: 'mirror + 90°', f: p => ({ x: CX + (p.y - CY), y: CY + (p.x - CX) }) },
  { name: 'everything', f: p => ({ x: CX - (p.y - CY), y: CY - (p.x - CX) }) },
];
let lvl = 0, stroke = [], drawing = false, samples = [], result = null, total = 0, scores = [];

function resample(path, step = 6) {
  const out = [];
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1], d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(1, Math.ceil(d / step));
    for (let k = 0; k < n; k++) out.push({ x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n });
  }
  out.push(path[path.length - 1]); return out;
}
function setup(i) { lvl = i; samples = resample(SHAPES[i].path); stroke = []; result = null; }

function score() {
  const TOL = 20;
  let covered = 0;
  for (const s of samples) if (stroke.some(p => (p.x - s.x) ** 2 + (p.y - s.y) ** 2 < TOL * TOL)) covered++;
  const pts = resample(stroke.length > 1 ? stroke : [stroke[0], stroke[0]], 6);
  let off = 0;
  for (const p of pts) if (!samples.some(s => (p.x - s.x) ** 2 + (p.y - s.y) ** 2 < (TOL + 6) ** 2)) off++;
  const cov = covered / samples.length, offR = off / pts.length;
  const pts100 = Math.max(0, Math.round(100 * cov - 60 * offR));
  return { cov, offR, pts: pts100 };
}

cv.addEventListener('pointerdown', e => {
  if (!inv.started) return;
  if (finalShown) { finalShown = false; scores = []; setup(0); return; }
  if (result) {
    if (lvl + 1 < SHAPES.length) setup(lvl + 1);
    else { total = scores.reduce((a, b) => a + b, 0); finalBest = Inverted.best('mt', total); finalShown = true; result = null; }
    return;
  }
  drawing = true; stroke = [MAPS[lvl].f(inv.toLocal(e.clientX, e.clientY))];
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  stroke.push(MAPS[lvl].f(inv.toLocal(e.clientX, e.clientY)));
});
cv.addEventListener('pointerup', () => {
  if (!drawing) return; drawing = false;
  if (stroke.length < 5) { stroke = []; return; }
  result = score(); scores[lvl] = result.pts;
  Inverted.beep(result.pts > 70 ? 880 : result.pts > 40 ? 520 : 200, 160, 'triangle');
});
let finalShown = false, finalBest = null;

function line(path, w, color) {
  if (path.length < 2) return;
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y); for (const p of path) ctx.lineTo(p.x, p.y); ctx.stroke();
}
function draw() {
  ctx.fillStyle = '#14131c'; ctx.fillRect(0, 0, 400, 700);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'left';
  ctx.fillText(`${lvl + 1}/${SHAPES.length}  ${SHAPES[lvl].name}`, 16, 36);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffc23d'; ctx.fillText(MAPS[lvl].name, 384, 36);
  line(SHAPES[lvl].path, 30, '#2c2a3a'); line(SHAPES[lvl].path, 4, '#5d5975');
  const s = SHAPES[lvl].path[0];
  ctx.fillStyle = '#ff4f8b'; ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, 7); ctx.fill();
  line(stroke, 6, result ? (result.pts > 70 ? '#29d17d' : result.pts > 40 ? '#ffc23d' : '#ff3355') : '#4fd3ff');
  ctx.textAlign = 'center';
  if (result) {
    ctx.fillStyle = '#000b'; ctx.fillRect(0, 590, 400, 110);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 34px system-ui'; ctx.fillText(result.pts + ' pts', 200, 632);
    ctx.font = '15px system-ui'; ctx.fillStyle = '#bbb';
    ctx.fillText(`covered ${Math.round(result.cov * 100)}%  ·  off the line ${Math.round(result.offR * 100)}%  ·  tap for next`, 200, 665);
  } else if (!stroke.length) {
    ctx.fillStyle = '#8a86a3'; ctx.font = '16px system-ui'; ctx.fillText('start on the pink dot (good luck finding it)', 200, 660);
  }
  if (finalShown) {
    ctx.fillStyle = '#000e'; ctx.fillRect(0, 0, 400, 700);
    const b = finalBest;
    ctx.fillStyle = '#29d17d'; ctx.font = 'bold 44px system-ui'; ctx.fillText(total + ' / ' + SHAPES.length * 100, 200, 300);
    ctx.fillStyle = '#fff'; ctx.font = '20px system-ui'; ctx.fillText(b.isNew ? 'New best!' : 'Best ' + b.best, 200, 345);
    ctx.fillStyle = '#bbb'; ctx.fillText('Tap to try again', 200, 400);
  }
  requestAnimationFrame(draw);
}
setup(0); draw();
</script>
</body></html>
